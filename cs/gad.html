<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>GAD Klausurtrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: register-tab sidebar + Karo (graph-paper) work sheet; solutions in Korrekturrot */
:root {
  --paper: #f3f5f2; --sheet: #ffffff; --grid: rgba(40, 90, 160, .075);
  --ink: #18212d; --muted: #586373; --line: #d6dce4; --line-strong: #b5bfcc;
  --accent: #1f4fd1; --accent-soft: #e2e9fb; --on-accent: #ffffff;
  --mark: #ffdd3c; --mark-soft: #fff3b0;
  --red: #c42f25; --red-soft: #fbe7e4;
  --ok: #187a49; --ok-soft: #dcf1e5;
  --node: #ffffff; --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .05);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131a; --sheet: #151c26; --grid: rgba(120, 160, 230, .07);
    --ink: #e4e9f1; --muted: #98a4b5; --line: #283241; --line-strong: #3a4657;
    --accent: #7fa3ff; --accent-soft: #1b2948; --on-accent: #0e131a;
    --mark: #e8c93c; --mark-soft: #3b3417;
    --red: #ff7a6e; --red-soft: #3a1e1c;
    --ok: #5ed49a; --ok-soft: #14301f;
    --node: #1b2430; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131a; --sheet: #151c26; --grid: rgba(120, 160, 230, .07);
  --ink: #e4e9f1; --muted: #98a4b5; --line: #283241; --line-strong: #3a4657;
  --accent: #7fa3ff; --accent-soft: #1b2948; --on-accent: #0e131a;
  --mark: #e8c93c; --mark-soft: #3b3417;
  --red: #ff7a6e; --red-soft: #3a1e1c;
  --ok: #5ed49a; --ok-soft: #14301f;
  --node: #1b2430; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--sheet); padding-block: 22px 28px; }
.brand { padding: 0 20px 18px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.brand .course { font: 600 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: 22px; margin-top: 8px; }
.brand p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.nav { display: flex; flex-direction: column; padding: 4px 10px; gap: 2px; }
.nav a { display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 6px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.nav a .no { font: 500 12px var(--f-mono); color: var(--muted); }
.nav a:hover { background: var(--paper); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a[aria-current="page"] .no { color: var(--accent); }
.side-foot { margin: 18px 20px 0; font-size: 12px; color: var(--muted); }

.main { --gut: clamp(16px, 4vw, 48px); min-width: 0; padding-block: 28px 80px; padding-inline: var(--gut);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.wrap { max-width: 1060px; margin: 0 auto; }
.topic-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.topic-head .kicker { font: 600 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.topic-head h2 { font-size: clamp(26px, 3.4vw, 36px); margin-top: 6px; }
.topic-head .lead { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.tabs { display: inline-flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--sheet); }

.mtop { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mtop { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); padding: 10px 16px; margin: -18px calc(-1 * var(--gut)) 16px; }
  .mtop .row { display: flex; gap: 10px; align-items: center; }
  .mtop strong { font-family: var(--f-display); font-size: 16px; }
  .mtop select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .main { padding-block: 18px 60px; }
}

/* cards */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .card { padding: 16px; } }
.card h3 { font-size: 19px; margin-bottom: 10px; }
.card h4 { font-size: 15px; margin: 14px 0 6px; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0; padding-left: 20px; }
.card li { margin: 3px 0; }
.insights { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 22px; box-shadow: var(--shadow); }
.insights h3 { font-size: 19px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.insights ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.insights li::marker { font: 600 13px var(--f-mono); color: var(--accent); }
.hl { background: linear-gradient(transparent 55%, var(--mark-soft) 55%); padding: 0 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--f-mono); padding: 3px 9px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.exam { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.formula { font-family: var(--f-mono); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; overflow-x: auto; margin: 8px 0; white-space: pre; font-size: 13.5px; }
.scroll { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; font-size: 14px; width: 100%; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.t th { font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.hi td { background: var(--mark-soft); }
.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.yes { color: var(--ok); font-weight: 600; } .no { color: var(--red); font-weight: 600; }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.btn { border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
.btn.red { border-color: var(--red); color: var(--red); }
.btn.red[aria-pressed="true"] { background: var(--red); color: var(--sheet); }
.btn:disabled { opacity: .45; cursor: default; }
.inp { border: 1px solid var(--line-strong); background: var(--paper); border-radius: 7px; padding: 6px 9px; min-width: 0; font-family: var(--f-mono); font-size: 14px; }
.inp.w4 { width: 4.2em; } .inp.w6 { width: 6.5em; } .inp.wide { width: min(100%, 28em); }
.inp.ok { border-color: var(--ok); background: var(--ok-soft); } .inp.bad { border-color: var(--red); background: var(--red-soft); }
label.lab { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
input[type=range] { accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.log { font: 13px/1.5 var(--f-mono); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; max-height: 150px; overflow: auto; }
.log div:last-child { color: var(--accent); font-weight: 600; }

/* array cells */
.arr { display: inline-flex; flex-wrap: wrap; gap: 0; font-family: var(--f-mono); }
.arr .cell { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
.arr .v { width: 100%; text-align: center; padding: 6px 4px; border: 1px solid var(--line-strong); margin-left: -1px; background: var(--node); font-size: 14px; min-height: 34px; }
.arr .i { font-size: 11px; color: var(--muted); padding-top: 2px; }
.arr .cell.hi .v { background: var(--mark); color: #1a1a1a; }
.arr .cell.ac .v { background: var(--accent); color: var(--on-accent); }
.arr .cell.ok .v { background: var(--ok-soft); }
.arr .cell.dim .v { color: var(--muted); background: var(--paper); }
.arr .cell.red .v { background: var(--red-soft); color: var(--red); }

/* svg */
svg.viz { display: block; max-width: 100%; height: auto; overflow: visible; }
svg.viz text { font-family: var(--f-mono); fill: var(--ink); }
svg.viz .edge { stroke: var(--line-strong); stroke-width: 1.6; fill: none; }
svg.viz .edge.hi { stroke: var(--accent); stroke-width: 3; }
svg.viz .edge.dim { stroke-dasharray: 4 4; opacity: .5; }
svg.viz .nd { fill: var(--node); stroke: var(--ink); stroke-width: 1.5; }
svg.viz .nd.hi { fill: var(--mark); } svg.viz .nd.ac { fill: var(--accent); stroke: var(--accent); }
svg.viz .nd.ok { fill: var(--ok-soft); stroke: var(--ok); }
svg.viz .nd.red { fill: var(--red-soft); stroke: var(--red); }
svg.viz text.ac { fill: var(--on-accent); } svg.viz text.hit { fill: #1a1a1a; }
svg.viz .sub { font-size: 11px; fill: var(--muted); }
svg.viz .sub.bad { fill: var(--red); font-weight: 700; }
svg.viz .wl { font-size: 12px; fill: var(--accent); font-weight: 600; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
svg.viz .axis { stroke: var(--line-strong); stroke-width: 1; }
svg.viz .gridl { stroke: var(--line); stroke-width: 1; }
svg.viz .lbl { font-size: 11px; fill: var(--muted); }
.vizbox { overflow-x: auto; max-width: 100%; padding: 6px 0; }

/* question cards */
.qbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow); }
.qbar .info { font-size: 13px; color: var(--muted); }
.q { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.q-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px 0; }
.q-head h3 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.q-head h3 .qn { font: 600 13px var(--f-mono); color: var(--accent); }
.q-body { padding: 10px 20px 4px; }
.q-body p { margin: 6px 0; }
.q-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 20px 16px; }
.fb { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); } .fb.bad { background: var(--red-soft); color: var(--red); }
.sol { margin: 0 20px 18px; border: 1.5px dashed var(--red); border-radius: 8px; padding: 12px 16px; background: color-mix(in srgb, var(--red-soft) 45%, var(--sheet)); }
.sol .sol-t { font: 700 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.mc { display: grid; gap: 6px; margin: 8px 0; }
.mc.cols { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.mc button { text-align: left; border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: var(--f-mono); font-size: 13.5px; }
.mc button:hover { border-color: var(--accent); }
.mc button.sel { border-color: var(--accent); background: var(--accent-soft); }
.mc button.right { border-color: var(--ok); background: var(--ok-soft); }
.mc button.wrong { border-color: var(--red); background: var(--red-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-family: var(--f-mono); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); } .chip.wrong { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.cat { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; margin: 4px; }
.cat button { min-width: 44px; }
.code { font: 13px/1.55 var(--f-mono); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; overflow-x: auto; white-space: pre; margin: 8px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }

</style>
<div id="app"></div>
<script>
/* ===== GAD algorithms (pure, testable with node) ===== */
var A = (function () {
  const A = {};

  /* ---------- random helpers ---------- */
  const R = {
    int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    distinct: (k, lo, hi) => { const s = new Set(); while (s.size < k) s.add(R.int(lo, hi)); return [...s]; },
    chance: (p) => Math.random() < p,
  };
  A.R = R;
  const range = (n) => [...Array(n).keys()];
  A.range = range;

  /* ---------- Landau: growth vectors ---------- */
  // g = [factorialLevel, log(expBase), polyDeg, logDeg]; compare lexicographically
  A.cmpGrowth = function (g1, g2) {
    for (let i = 0; i < 4; i++) {
      const d = (g1[i] || 0) - (g2[i] || 0);
      if (Math.abs(d) > 1e-9) return d < 0 ? -1 : 1;
    }
    return 0;
  };
  A.symbolsFor = function (c) {
    // f in Γ(g): c = cmp(f,g)
    if (c < 0) return ['o', 'O'];
    if (c > 0) return ['ω', 'Ω'];
    return ['Θ', 'O', 'Ω'];
  };

  /* ---------- Master theorem (lecture version) ---------- */
  A.master = function (d, b) {
    if (d < b) return { case: 'd<b', res: 'Θ(n)' };
    if (d === b) return { case: 'd=b', res: 'Θ(n log n)' };
    return { case: 'd>b', res: 'Θ(n^{log_' + b + ' ' + d + '})', exp: Math.log(d) / Math.log(b) };
  };

  /* ---------- Dynamic array (UArray from lecture) ---------- */
  A.dynArray = function (ops, alpha = 4, beta = 2) {
    let w = 1, n = 0, b = [];
    const steps = [];
    for (const op of ops) {
      let realloc = null, cost = 1;
      if (op.t === 'push') {
        if (n === w) { realloc = { from: w, to: beta * w, copies: n }; cost += n; w = beta * w; }
        b[n] = op.x; n++;
      } else {
        if (n === 0) { steps.push({ op, w, n, arr: b.slice(0, n), realloc: null, cost: 0, err: true }); continue; }
        n--; b.length = n;
        if (alpha * n <= w && n > 0) { realloc = { from: w, to: w / beta, copies: n }; cost += n; w = w / beta; }
      }
      steps.push({ op, w, n, arr: b.slice(0, n), realloc, cost });
    }
    return steps;
  };

  /* ---------- Circular queue (lecture: n+1 slots, h first, t first free) ---------- */
  A.ringSize = (h, t, n) => (t - h + n + 1) % (n + 1);

  /* ---------- Sorting with frames ---------- */
  A.quickPartitionLecture = function (a, l, r, log) {
    // lecture in-place partition; returns final pivot index
    const p = a[r]; let i = l - 1, j = r;
    do {
      do { i++; } while (a[i] < p);
      do { j--; } while (j >= l && a[j] > p);
      if (i < j) { [a[i], a[j]] = [a[j], a[i]]; log && log.push({ type: 'swap', i, j, arr: a.slice(), pivot: r }); }
    } while (i < j);
    [a[i], a[r]] = [a[r], a[i]];
    log && log.push({ type: 'pivot', i, j: r, arr: a.slice(), pivot: i });
    return i;
  };
  A.quickSortFrames = function (arr) {
    const a = arr.slice(), frames = [{ arr: a.slice(), hi: [], note: 'Start' }];
    (function qs(l, r) {
      if (l < r) {
        frames.push({ arr: a.slice(), hi: [r], range: [l, r], note: 'Teilfeld [' + l + '..' + r + '], Pivot p = ' + a[r] });
        const log = [];
        const m = A.quickPartitionLecture(a, l, r, log);
        for (const e of log) frames.push({ arr: e.arr, hi: [e.i, e.j], range: [l, r], note: e.type === 'swap' ? 'swap(' + e.arr[e.j] + ', ' + e.arr[e.i] + ')' : 'Pivot ' + a[m] + ' an Position ' + m, fixed: e.type === 'pivot' ? [m] : [] });
        qs(l, m - 1); qs(m + 1, r);
      }
    })(0, a.length - 1);
    frames.push({ arr: a.slice(), hi: [], note: 'Sortiert', done: true });
    return frames;
  };
  A.quickStep = function (arr) { const a = arr.slice(); A.quickPartitionLecture(a, 0, a.length - 1); return a; };

  A.insertionFrames = function (arr) {
    const a = arr.slice(), f = [{ arr: a.slice(), hi: [], note: 'Start' }];
    for (let i = 1; i < a.length; i++) {
      let j = i;
      f.push({ arr: a.slice(), hi: [i], note: 'Füge ' + a[i] + ' in sortierten Präfix ein' });
      while (j > 0 && a[j - 1] > a[j]) { [a[j - 1], a[j]] = [a[j], a[j - 1]]; j--; f.push({ arr: a.slice(), hi: [j, j + 1], note: 'swap' }); }
    }
    f.push({ arr: a.slice(), hi: [], note: 'Sortiert', done: true });
    return f;
  };
  A.selectionFrames = function (arr) {
    const a = arr.slice(), f = [{ arr: a.slice(), hi: [], note: 'Start' }];
    for (let i = 0; i < a.length - 1; i++) {
      let m = i; for (let j = i + 1; j < a.length; j++) if (a[j] < a[m]) m = j;
      [a[i], a[m]] = [a[m], a[i]];
      f.push({ arr: a.slice(), hi: [i, m], note: 'Minimum ' + a[i] + ' nach Position ' + i, fixed: range(i + 1) });
    }
    f.push({ arr: a.slice(), hi: [], note: 'Sortiert', done: true });
    return f;
  };
  A.mergeSortTree = function (arr) {
    // returns levels: split tree + merge results; mid = ceil(n/2)
    function rec(a) {

/* ---- routing ---- */
let state = { id: null, tab: 'sum' };
function readHash() {
  const h = (location.hash || '').slice(1); const [id, tab] = h.split('.');
  return { id: TOPICS.some(t => t.id === id) ? id : TOPICS[0].id, tab: tab === 'q' ? 'q' : 'sum' };
}
function go(id, tab) { state = { id, tab }; try { history.replaceState(null, '', '#' + id + (tab === 'q' ? '.q' : '')); } catch (e) {} render(); }

function buildShell() {
  const root = $('#app');
  root.innerHTML = `
  <div class="app">
    <aside class="side" aria-label="Themen">
      <div class="brand"><div class="course">IN0007 · TUM</div><h1>GAD Klausurtrainer</h1><p>Grundlagen: Algorithmen und Datenstrukturen</p></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">Lösungswege folgen den Konventionen der Vorlesung.</div>
    </aside>
    <main class="main">
      <div class="mtop"><div class="row"><strong>GAD</strong><select id="msel" aria-label="Thema wählen"></select></div></div>
      <div class="wrap" id="view"></div>
    </main>
  </div>`;
  $('#nav').innerHTML = TOPICS.map((t, i) => `<a href="#${t.id}" data-id="${t.id}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span>${t.title}</span></a>`).join('');
  $$('#nav a').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.id, 'sum'); window.scrollTo(0, 0); }));
  $('#msel').innerHTML = TOPICS.map((t, i) => `<option value="${t.id}">${i + 1}. ${t.title}</option>`).join('');
  $('#msel').addEventListener('change', (e) => { go(e.target.value, state.tab); window.scrollTo(0, 0); });
}

function render() {
  const t = TOPICS.find(x => x.id === state.id), idx = TOPICS.indexOf(t);
  $$('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === t.id ? 'page' : 'false'));
  $('#msel').value = t.id;
  const v = $('#view');
  v.innerHTML = `
    <header class="topic-head">
      <div><div class="kicker">Kapitel ${idx + 1}</div><h2>${t.title}</h2><p class="lead">${t.lead}</p></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-sum" aria-selected="${state.tab === 'sum'}">Zusammenfassung</button>
        <button role="tab" id="tab-q" aria-selected="${state.tab === 'q'}">Übungsaufgaben · ${t.gens.length}</button>
      </div>
    </header>
    <section id="pane" class="stack fade"></section>`;
  $('#tab-sum').addEventListener('click', () => go(t.id, 'sum'));
  $('#tab-q').addEventListener('click', () => go(t.id, 'q'));
  const pane = $('#pane');
  if (state.tab === 'sum') {
    try { t.summary(pane); } catch (e) { pane.innerHTML = '<div class="card">Fehler beim Rendern: ' + V.esc(e.message) + '</div>'; console.error(e); }
  } else renderQuestions(pane, t);
}

function renderQuestions(pane, t) {
  pane.innerHTML = `<div class="qbar"><div class="info">Jede Aufgabe wird zufällig erzeugt. „Neue Variante“ würfelt eine Aufgabe neu, „Alle neu“ den ganzen Satz.</div>
    <div class="ctrl" style="margin:0"><button class="btn" id="allsol" aria-pressed="false">Alle Lösungen zeigen</button><button class="btn primary" id="allnew">Alle neu</button></div></div><div class="stack" id="qs"></div>`;
  const qs = $('#qs'); const cards = t.gens.map((g, i) => mountQ(qs, g, i + 1));
  $('#allnew').addEventListener('click', () => cards.forEach(c => c.fresh()));
  $('#allsol').addEventListener('click', (e) => { const on = e.target.getAttribute('aria-pressed') !== 'true'; e.target.setAttribute('aria-pressed', on); e.target.textContent = on ? 'Alle Lösungen verbergen' : 'Alle Lösungen zeigen'; cards.forEach(c => c.showSol(on)); });
}

function mountQ(container, gen, n) {
  const card = document.createElement('article'); card.className = 'q'; container.appendChild(card);
  let inst;
  function showSol(on) { const s = $('.sol', card), b = $('[data-a="sol"]', card); s.hidden = !on; b.textContent = on ? 'Lösung verbergen' : 'Lösung zeigen'; b.setAttribute('aria-pressed', on); }
  function fresh() {
    let tries = 0;
    for (;;) { try { inst = gen.make(); break; } catch (e) { if (++tries > 20) { console.error(e); inst = { html: 'Fehler beim Erzeugen: ' + V.esc(e.message), sol: '' }; break; } } }
    card.innerHTML = `
      <div class="q-head"><h3><span class="qn">A${n}</span>${gen.title}</h3></div>
      <div class="q-body">${inst.html}</div>
      <div class="q-foot">
        ${inst.check ? '<button class="btn primary" data-a="check">Prüfen</button>' : ''}
        <button class="btn red" data-a="sol" aria-pressed="false">Lösung zeigen</button>
        <button class="btn" data-a="new">Neue Variante</button>
        <span class="fb" hidden></span>
      </div>
      <div class="sol" hidden><div class="sol-t">Lösungsvorschlag</div>${typeof inst.sol === 'function' ? inst.sol() : inst.sol}</div>`;
    const body = $('.q-body', card);
    inst.mount && inst.mount(body);
    $('[data-a="sol"]', card).addEventListener('click', () => showSol($('.sol', card).hidden));
    $('[data-a="new"]', card).addEventListener('click', fresh);
    const cb = $('[data-a="check"]', card);
    if (cb) cb.addEventListener('click', () => {
      const r = inst.check(body); const fb = $('.fb', card); fb.hidden = false;
      const ok = r === true || (r && r.ok);
      fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.textContent = (r && r.msg) || (ok ? 'Richtig!' : 'Noch nicht ganz – markierte Felder prüfen.');
    });
  }
  fresh();
  return { fresh, showSol };
}

function boot() {
  buildShell();
  state = readHash();
  render();
  window.addEventListener('hashchange', () => { const s = readHash(); if (s.id !== state.id || s.tab !== state.tab) { state = s; render(); } });
}

(function () {

  const BH = {
    rank: (t) => t.kids.length,
    link(a, b, max) { const better = max ? a.k >= b.k : a.k <= b.k; const [r, c] = better ? [a, b] : [b, a]; return { k: r.k, kids: r.kids.concat([c]) }; },
    merge(h1, h2, max) {
      const by = {}; let triple = false;
      [...h1, ...h2].forEach(t => (by[BH.rank(t)] = by[BH.rank(t)] || []).push(t));
      const out = []; let carry = null;
      for (let r = 0; r < 40; r++) {
        const ts = (by[r] || []).slice(); if (carry) ts.push(carry); carry = null;
        if (ts.length === 1) out.push(ts[0]);
        else if (ts.length === 2) carry = BH.link(ts[0], ts[1], max);
        else if (ts.length === 3) { triple = true; out.push(ts[2]); carry = BH.link(ts[0], ts[1], max); }
      }
      out.triple = triple; return out;
    },
    fromKeys(keys, max) { let h = []; keys.forEach(k => { h = BH.merge(h, [{ k, kids: [] }], max); }); return h; },
    deleteTop(h, max) {

    },

    for (let i = 0; i < T.length; i++) { const inWin = i >= step.i && i < step.i + P.length; const k = i - step.i; const cls = inWin ? (k < step.j ? 'ok' : k === step.j && !step.match ? 'red' : '') : ''; s += `<rect class="nd ${cls}" x="${10 + i * cw}" y="6" width="${cw - 2}" height="24" rx="3"/><text x="${10 + i * cw + cw / 2 - 1}" y="23" text-anchor="middle" font-size="13">${T[i]}</text>`; }
    for (let k = 0; k < P.length; k++) { const x = 10 + (step.i + k) * cw; const cls = k < step.j ? 'ok' : k === step.j && !step.match ? 'red' : ''; s += `<rect class="nd ${cls}" x="${x}" y="40" width="${cw - 2}" height="24" rx="3"/><text x="${x + cw / 2 - 1}" y="57" text-anchor="middle" font-size="13">${P[k]}</text>`; }
    return `<svg class="viz" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
  }

  topic({
    id: 'pm', title: 'Pattern Matching',
    lead: 'Ränder von Wörtern, die border-Tabelle und der Knuth-Morris-Pratt-Algorithmus.',
    summary(el) {
      el.innerHTML = `
      ${insights([
        'Ein <b>Rand</b> von w ist ein Wort, das zugleich Präfix und Suffix von w ist. ε und w selbst sind immer Ränder; der <span class="hl">eigentliche Rand</span> ist der längste Rand ≠ w.',
        'border-Tabelle des Suchworts P: border[0] = −1, border[i] = Länge des eigentlichen Randes des Präfixes P[0..i−1] (für i = 1…m). Sie enthält <b>Längen</b>, keine Wörter.',
        'Naive Suche: O(n·m). KMP: nach j passenden Zeichen und Fehler wird um j − border[j] verschoben, weiter vergleichen ab Position border[j] ⇒ <b>O(n + m)</b>, kein Zurückspringen im Text.',
        'Ränder systematisch finden: alle k mit P[0..k−1] = P[m−k..m−1] prüfen; Ränder eines Randes sind wieder Ränder (border[border[i]] …).',
        'Wörter mit vorgegebenem eigentlichem Rand c: w = c x c (auch überlappend: c teilt sich Zeichen), aber kein längerer Rand darf entstehen.',
      ])}
      ${card('Ränder & border-Tabelle', `
        <div class="ctrl"><label class="lab" for="pmW">Wort</label><input class="inp wide" id="pmW" value="aabaabaa" aria-label="Wort"><button class="btn" id="pmR">Zufallswort</button></div>
        <div class="vizbox" id="pmView"></div><div id="pmInfo"></div>`)}
      ${card('KMP Schritt für Schritt', `
        <div class="ctrl"><label class="lab">Text</label><input class="inp" id="kT" value="abaabaababaababa" style="width:16em"><label class="lab">Muster</label><input class="inp" id="kP" value="abaaba" style="width:9em"></div>
        <div class="ctrl"><button class="btn" id="kPrev">◀</button><button class="btn primary" id="kNext">Schritt ▶</button><span class="mono small" id="kCnt"></span></div>
        <div class="vizbox" id="kView"></div><div class="log" id="kNote" style="max-height:none"></div>`)}`;
      const upd = () => {
        const w = $('#pmW').value.trim() || 'a';
        $('#pmView').innerHTML = borderViz(w);
        const bs = PM.borders(w), bt = PM.borderTable(w);
        $('#pmInfo').innerHTML = `<p>Ränder: <span class="mono">${bs.map(k => k ? w.slice(0, k) : 'ε').join(', ')}</span> · eigentlicher Rand: <b class="mono">${PM.properBorderLen(w) ? w.slice(0, PM.properBorderLen(w)) : 'ε'}</b></p><div class="scroll">${V.arr(bt, { idx: A.range(w.length + 1).map(i => i) })}</div><p class="small muted">Spalte i = border[i] für das Präfix der Länge i.</p>`;
      };
      $('#pmW').addEventListener('input', upd); $('#pmR').addEventListener('click', () => { $('#pmW').value = rw(R.int(6, 11)); upd(); }); upd();
      let st, k = 0;
      const kshow = () => { const T = $('#kT').value, P = $('#kP').value; const s = st.steps[k]; if (!s) { $('#kView').innerHTML = ''; $('#kNote').textContent = 'Kein Schritt (Muster länger als Text?)'; return; } $('#kView').innerHTML = kmpViz(T, P, s); $('#kNote').textContent = `Ausrichtung i = ${s.i}: ${s.match ? 'Treffer!' : s.j + ' Zeichen passen, Fehler bei j = ' + s.j} → verschiebe um j − border[j] = ${s.j} − (${st.border[s.j]}) = ${s.j - st.border[s.j]}. Treffer gesamt: ${st.hits.join(', ') || '–'}`; $('#kCnt').textContent = `${k + 1} / ${st.steps.length}`; };
      const krun = () => { st = PM.kmp($('#kT').value, $('#kP').value); k = 0; kshow(); };
      $('#kT').addEventListener('input', krun); $('#kP').addEventListener('input', krun);
      $('#kNext').addEventListener('click', () => { k = Math.min(k + 1, st.steps.length - 1); kshow(); }); $('#kPrev').addEventListener('click', () => { k = Math.max(k - 1, 0); kshow(); });
      krun();
    },
    gens: [
      {
        title: 'Alle Ränder eines Wortes',
        make() {
          let w; do { const c = rw(R.int(2, 4)); w = c + rw(R.int(1, 4)) + c; if (R.chance(0.5)) w = c + rw(R.int(0, 2)) + w.slice(c.length); } while (PM.borders(w).length < 4 || w.length > 15);
          const bs = PM.borders(w).filter(k => k > 0).map(k => w.slice(0, k));
          return {
            html: `<p>Gib alle Ränder von <b class="mono">v = ${w}</b> an (ε darfst du weglassen, v selbst gehört dazu).</p>${Q.input('b', { ph: 'z.B. a, aa, …' })}`,
            check: (b) => { const got = Q.parse(Q.val(b, 'b')).map(String).filter(x => !/^(ε|eps|epsilon)$/.test(x)); return Q.mark(Q.el(b, 'b'), got.length === bs.length && bs.every(x => got.includes(x))); },
            sol: `<p>ε, ${bs.map(x => `<span class="mono">${x}</span>`).join(', ')}</p><div class="vizbox">${borderViz(w)}</div>`,
          };
        },
      },
      {
        title: 'border-Tabellen aufstellen',
        make() {
          const ws = [R.chance(0.3) ? 'a'.repeat(R.int(4, 6)) : rw(R.int(5, 7)), rw(R.int(6, 8))];
          return {
            html: ws.map((w, i) => `<p>Suchwort <b class="mono">${w}</b>: border[0 … ${w.length}]</p>${Q.cells('t' + i, w.length + 1)}`).join(''),
            check: (b) => ws.map((w, i) => Q.checkCells(b, 't' + i, PM.borderTable(w))).every(Boolean),
            sol: ws.map(w => `<p class="mono">${w}</p>${V.arr(PM.borderTable(w))}<p class="small">${A.range(w.length).map(i => `„${w.slice(0, i + 1)}“ → ${PM.borderTable(w)[i + 1]}`).join(' · ')}</p>`).join(''),
          };
        },
      },
      {
        title: 'Alle Wörter mit vorgegebenem eigentlichem Rand',
        make() {
          for (;;) {
            const c = rw(R.int(3, 5)); const L = Math.min(12, c.length + R.int(2, 4));
            const out = [];
            for (let len = c.length + 1; len <= L; len++) for (let m = 0; m < (1 << len); m++) { let w = ''; for (let i = 0; i < len; i++) w += (m >> i & 1) ? 'b' : 'a'; if (PM.properBorderLen(w) === c.length && w.startsWith(c)) out.push(w); }
            if (out.length < 2 || out.length > 9) continue;
            return {
              html: `<p>Alphabet Σ = {a, b}. Gib alle Wörter w an mit</p><ul><li>eigentlicher Rand von w ist <b class="mono">${c}</b></li><li>|w| ≤ ${L}</li></ul>${Q.input('w', { ph: 'Wörter durch Komma getrennt' })}<p class="small muted">Es gibt ${out.length} Lösungen.</p>`,
              check: (b) => { const got = Q.parse(Q.val(b, 'w')).map(String); return Q.mark(Q.el(b, 'w'), got.length === out.length && out.every(x => got.includes(x))); },
              sol: `<p class="mono">${out.join('<br>')}</p><p class="small">Idee: w beginnt und endet mit ${c} (evtl. überlappend); ausgeschlossen werden Wörter, deren eigentlicher Rand länger ist.</p>`,
            };
          }
        },
      },
      {
        title: 'KMP: Ausrichtungen und Treffer',
        make() {
          const P = rw(R.int(3, 5)); let T = rw(R.int(10, 14)); const pos = R.int(0, T.length - P.length); T = T.slice(0, pos) + P + T.slice(pos + P.length);
          const r = PM.kmp(T, P);
          return {
            html: `<p>Text <b class="mono">${T}</b>, Muster <b class="mono">${P}</b>.</p><p>border-Tabelle des Musters:</p>${Q.cells('b', P.length + 1)}<p>Startpositionen i aller Ausrichtungen, die KMP prüft: ${Q.input('i')}</p><p>Trefferpositionen: ${Q.input('h')}</p>`,
            check: (b) => [Q.checkCells(b, 'b', r.border), Q.checkList(b, 'i', r.steps.map(s => s.i)), Q.checkList(b, 'h', r.hits)].every(Boolean),
            sol: `${V.arr(r.border)}<ol>${r.steps.map(s => `<li>i = ${s.i}: ${s.match ? '<b>Treffer</b>' : s.j + ' Zeichen passen'} → i += ${s.j} − (${r.border[s.j]})</li>`).join('')}</ol><p>Treffer bei <b>${r.hits.join(', ')}</b>. Naiv wären ${T.length - P.length + 1} Ausrichtungen nötig.</p>`,
          };
        },
      },
    ],
  });
})();

/* ===== 10 Datenkompression ===== */
(function () {
  const R = A.R, C = A.comp;
  function huffTree(root) {
    const g = (t, code) => t.sym !== undefined ? { label: t.sym, kids: [], cls: 'hi', code } : { label: (+t.w.toFixed(3)).toString(), kids: [g(t.l, code + '0'), g(t.r, code + '1')] };
    return V.gtree(g(root, ''), { r: 17, dx: 46, dy: 50 });
  }
  function randDist(k) {
    // probabilities as multiples of 0.05, distinct-ish
    for (;;) { const parts = A.range(k).map(() => R.int(1, 8)); const s = parts.reduce((a, b) => a + b, 0); if (s !== 20) continue; return parts.map(p => p / 20); }
  }
  const fx = (x, d = 3) => (+x.toFixed(d)).toString();

  topic({
    id: 'comp', title: 'Datenkompression',
    lead: 'Informationsgehalt, Entropie, Präfixcodes, Huffman- und Shannon-Fano-Codierung sowie LZ77.',
    summary(el) {
      el.innerHTML = `
      ${insights([
        'Informationsgehalt I(a) = −log₂ p(a); <span class="hl">Entropie H(p) = −Σ p<sub>i</sub> log₂ p<sub>i</sub></span> = untere Schranke für die mittlere Codelänge (Shannon).',
        'Huffman (Greedy, von den Blättern aufwärts): immer die zwei leichtesten Knoten zusammenfassen ⇒ optimaler Präfixcode mit ganzzahligen Bitlängen.',
        'Shannon-Fano (von der Wurzel abwärts): absteigend sortieren, Liste so teilen, dass die Summen möglichst gleich sind, rekursiv. Nicht immer optimal.',
        'Mittlere Codelänge l̄ = Σ p<sub>i</sub>·l<sub>i</sub>; Kompressionsrate CR = 1 − C/E (negativ ⇒ Datenexpansion).',
        'LZ77: Tripel (offset, länge, next) mit Search- und Look-ahead-Buffer; längster Treffer im Search-Buffer, Überlappung in den Look-ahead ist erlaubt. Schnelle Dekompression, Suche aufwendig.',
        'Präfixcode: kein Codewort ist Präfix eines anderen ⇒ eindeutig decodierbar (Code als Binärbaum, Symbole in den Blättern).',
      ])}
      ${card('Huffman-Baum-Baukasten', `
        <div class="ctrl" id="huIn"></div><div class="ctrl"><button class="btn" id="huR">Zufällige Verteilung</button><button class="btn" id="huA">„abrakadabra“</button></div>
        <div class="grid2"><div class="vizbox" id="huT"></div><div id="huTab"></div></div>`)}
      ${card('LZ77 codieren', `
        <div class="ctrl"><input class="inp wide" id="lzS" value="aacaacabcabaaa" aria-label="Eingabe"><label class="lab">Search</label><input class="inp w4" id="lzSB" value="6"><label class="lab">Look-ahead</label><input class="inp w4" id="lzLB" value="4"></div>
        <div id="lzOut"></div><p class="small muted">Konvention wie im Vorlesungsbeispiel: Trefferlänge höchstens Look-ahead − 1, bei gleich langen Treffern der kleinste Offset.</p>`)}`;
      let syms = ['a', 'b', 'c', 'd', 'e'], ws = [0.35, 0.2, 0.2, 0.15, 0.1];
      const renderIn = () => { $('#huIn').innerHTML = syms.map((s, i) => `<label class="lab"><span class="mono">${s}</span><input class="inp w4" data-i="${i}" value="${ws[i]}"></label>`).join(''); $$('#huIn input').forEach(inp => inp.addEventListener('input', () => { ws[+inp.dataset.i] = Math.max(0, Q.num(inp.value) || 0); calc(); })); };
      const calc = () => {
        const tot = ws.reduce((a, b) => a + b, 0) || 1, ps = ws.map(w => w / tot);
        const h = C.huffman(syms, ps), sf = C.shannonFano(syms, ps), H = C.entropy(ps);
        const lh = ps.reduce((s, p, i) => s + p * h.lengths[i], 0), ls = ps.reduce((s, p, i) => s + p * sf.lengths[i], 0);
        $('#huT').innerHTML = huffTree(h.root);
        $('#huTab').innerHTML = `<table class="t"><tr><th>Symbol</th><th>p</th><th>I = −log₂ p</th><th>Huffman</th><th>Shannon-Fano</th></tr>${syms.map((s, i) => `<tr><td class="mono">${s}</td><td class="num">${fx(ps[i])}</td><td class="num">${fx(-Math.log2(ps[i] || 1))}</td><td class="mono">${h.codes[s]}</td><td class="mono">${sf.codes[s]}</td></tr>`).join('')}</table>
          <p class="small">Mittlere Länge: Huffman <b>${fx(lh)}</b>, Shannon-Fano <b>${fx(ls)}</b> Bit/Symbol · Entropie <b>${fx(H)}</b> Bit/Symbol</p>`;
      };
      renderIn(); calc();
      $('#huR').addEventListener('click', () => { const k = R.int(4, 6); syms = 'abcdef'.slice(0, k).split(''); ws = randDist(k); renderIn(); calc(); });
      $('#huA').addEventListener('click', () => { syms = ['A', 'B', 'R', 'K', 'D']; ws = [5, 2, 2, 1, 1]; renderIn(); calc(); });
      const lz = () => {
        const s = $('#lzS').value, S = +$('#lzSB').value || 6, L = +$('#lzLB').value || 4; if (!s) return;
        const t = C.lz77Encode(s, S, L); const bitsS = Math.ceil(Math.log2(S + 1)), bitsL = Math.ceil(Math.log2(L)); const bits = t.length * (bitsS + bitsL + 8);
        $('#lzOut').innerHTML = `<p class="mono">${t.map(x => `(${x[0]},${x[1]},'${x[2] ?? ''}')`).join(' ')}</p><p class="small">${t.length} Tripel × (${bitsS} + ${bitsL} + 8) Bit = ${bits} Bit statt ${s.length * 8} Bit ASCII ⇒ CR = ${fx((1 - bits / (s.length * 8)) * 100, 1)} %</p>`;
      };
      ['lzS', 'lzSB', 'lzLB'].forEach(id => $('#' + id).addEventListener('input', lz)); lz();
    },
    gens: [
      {
        title: 'Huffman, Shannon-Fano und Entropie',
        make() {
          for (;;) {
            const k = R.int(4, 5), syms = 'abcde'.slice(0, k).split(''), ps = randDist(k);
            const sf = C.shannonFano(syms, ps); if (sf.tie) continue;
            const h = C.huffman(syms, ps), H = C.entropy(ps);
            const lh = ps.reduce((s, p, i) => s + p * h.lengths[i], 0), ls = ps.reduce((s, p, i) => s + p * sf.lengths[i], 0);
            return {
              html: `<p>Quelle ohne Gedächtnis:</p><table class="t num" style="width:auto"><tr><th>Symbol</th>${syms.map(s => `<td>${s}</td>`).join('')}</tr><tr><th>p</th>${ps.map(p => `<td>${p}</td>`).join('')}</tr></table>
                <p>a) Codelängen Huffman:</p>${Q.cells('h', k, { labels: syms })}<p>mittlere Länge: ${Q.input('lh', { cls: 'w6' })}</p>
                <p>b) Codelängen Shannon-Fano:</p>${Q.cells('s', k, { labels: syms })}<p>mittlere Länge: ${Q.input('ls', { cls: 'w6' })}</p>
                <p>c) Entropie (3 Nachkommastellen): ${Q.input('e', { cls: 'w6' })}</p>`,
              check: (b) => {
                // Huffman lengths: accept any optimal prefix code lengths (ties)
                const hi = Q.readCells(b, 'h', k), got = hi.map(x => Q.num(x.value));
                const kraft = got.reduce((s, l) => s + Math.pow(2, -l), 0), avg = ps.reduce((s, p, i) => s + p * got[i], 0);
                const okH = got.every(Number.isInteger) && Math.abs(kraft - 1) < 1e-9 && Math.abs(avg - lh) < 1e-9; hi.forEach(x => Q.mark(x, okH));
                return [okH, Q.checkNum(b, 'lh', lh, 0.0015), Q.checkCells(b, 's', sf.lengths), Q.checkNum(b, 'ls', ls, 0.0015), Q.checkNum(b, 'e', H, 0.0015)].every(Boolean);
              },
              sol: `<div class="grid2"><div class="vizbox">${huffTree(h.root)}</div><div><p>Huffman: ${syms.map(s => `${s} = <span class="mono">${h.codes[s]}</span>`).join(', ')} ⇒ l̄ = ${syms.map((s, i) => `${ps[i]}·${h.lengths[i]}`).join(' + ')} = <b>${fx(lh)}</b></p><p>Shannon-Fano: ${syms.map(s => `${s} = <span class="mono">${sf.codes[s]}</span>`).join(', ')} ⇒ l̄ = <b>${fx(ls)}</b></p><p>H = −Σ p log₂ p = <b>${fx(H, 4)}</b> Bit/Symbol</p><p class="small muted">Bei gleichen Gewichten sind mehrere Huffman-Bäume möglich – die mittlere Länge ist immer dieselbe.</p></div></div>`,
            };
          }
        },
      },
      {
        title: 'LZ77 decodieren und codieren',
        make() {
          const base = A.range(R.int(10, 14)).map(() => R.pick(['a', 'a', 'b', 'c'])).join('');
          const trips = C.lz77Encode(base, 6, 4), dec = C.lz77Decode(trips);
          const s2 = A.range(R.int(9, 11)).map(() => R.pick(['a', 'b', 'b', 'c'])).join(''); const t2 = C.lz77Encode(s2, 6, 4);
          return {
            html: `<p>a) Decodiere die LZ77-Tripel (offset, länge, next): <span class="mono">${trips.map(x => `(${x[0]},${x[1]},'${x[2]}')`).join(' ')}</span></p>${Q.input('d', { ph: 'decodierter Text' })}
              <p>b) Codiere <b class="mono">${s2}</b> (Search-Buffer 6, Look-ahead 4, Trefferlänge ≤ 3). Anzahl Tripel: ${Q.input('n', { cls: 'w4' })}</p>`,
            check: (b) => { const inp = Q.el(b, 'd'); const ok = Q.mark(inp, inp.value.replace(/\s/g, '') === dec); return [ok, Q.checkNum(b, 'n', t2.length)].every(Boolean); },
            sol: `<p>a) <b class="mono">${dec}</b></p><ol>${(() => { let s = ''; return trips.map(([o, l, c]) => { const st = s.length - o; let add = ''; for (let k = 0; k < l; k++) { add += (s + add)[st + k]; } s += add + c; return `<li class="mono small">(${o},${l},'${c}') → ${s}</li>`; }).join(''); })()}</ol><p>b) <span class="mono">${t2.map(x => `(${x[0]},${x[1]},'${x[2]}')`).join(' ')}</span> ⇒ <b>${t2.length}</b> Tripel</p>`,
          };
        },
      },
      {
        title: 'Kompressionsrate und Informationsgehalt',
        make() {
          const E = R.pick([88, 112, 128, 160, 200]), Cc = R.int(Math.round(E * 0.2), Math.round(E * 1.1)); const cr = 1 - Cc / E;
          const k = R.int(1, 6), p = Math.pow(2, -k);
          return {
            html: `<p>a) Eingabe ${E} Bit, komprimiert ${Cc} Bit. Kompressionsrate CR in % (1 Nachkommastelle): ${Q.input('c', { cls: 'w6' })}</p><p>b) Informationsgehalt eines Symbols mit p = 1/${1 << k} in Bit: ${Q.input('i', { cls: 'w4' })}</p><p>c) Ist der Code {A ↦ 0, B ↦ 01, C ↦ 10} ein Präfixcode?</p>${Q.mc('p', ['ja', 'nein'])}`,
            mount(b) { Q.mountMC(b, 'p', 1); },
            check: (b) => [Q.checkNum(b, 'c', +(cr * 100).toFixed(1), 0.06), Q.checkNum(b, 'i', k)].every(Boolean),
            sol: `<p>a) CR = 1 − ${Cc}/${E} = <b>${(cr * 100).toFixed(1)} %</b>${cr < 0 ? ' (Datenexpansion!)' : ''}</p><p>b) I = −log₂(1/${1 << k}) = <b>${k}</b> Bit</p><p>c) <b>Nein</b>: 0 ist Präfix von 01 ⇒ 001010 ist mehrdeutig (AACC, ABAC, ABBA).</p>`,
          };
        },
      },
    ],
  });
})();

boot();
</script>
